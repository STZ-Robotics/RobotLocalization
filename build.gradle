import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'maven-publish'
    id "edu.wpi.first.GradleRIO" version "2026.1.1" 
}

def jsonFile = file('MarsFeature.json')
def parsedJson = new JsonSlurper().parseText(jsonFile.text)

group = parsedJson.groupId
version = parsedJson.version

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The sources are UTF-8. Without this javac falls back to the platform codepage
// (windows-1252 here) and any non-ASCII symbol in a javadoc comes out mangled.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()

    maven {
        url = uri("https://Imcab.github.io/FORGEmini/maven/")
    }

    maven {
        url = uri("https://STZ-Robotics.github.io/Mars/maven/")
    }

    maven {
        url = uri("https://maven.photonvision.org/repository/internal")
    }

    maven {
        url = uri("https://maven.questnav.gg/releases")
    }

    maven {
        url = uri("https://maven.questnav.gg/snapshots")
    }
}

ext.photonVersion = 'v2026.1.1'
ext.questNavVersion = '2026-2.1.0'

def toGradleRange(String constraint) {
    if (constraint.startsWith(">=")) {
        return "[${constraint.substring(2).trim()},)"
    } else if (constraint.startsWith(">")) {
        return "(${constraint.substring(1).trim()},)"
    } else if (constraint.startsWith("<=")) {
        return "(,${constraint.substring(2).trim()}]"
    } else if (constraint.startsWith("<")) {
        return "(,${constraint.substring(1).trim()})"
    }
    // No operator: an exact version is assumed
    return constraint.trim()
}

dependencies {
    implementation wpi.java.deps.wpilib()
    implementation "edu.wpi.first.wpilibNewCommands:wpilibNewCommands-java:${wpi.versions.wpilibVersion.get()}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Desktop natives (ntcore, wpimath, photontargeting...). Without them any test that
    // touches NetworkTables or the vision simulation dies while loading the JNI.
    nativeRelease wpi.java.deps.wpilibJniRelease(wpi.platforms.desktop)
    nativeRelease "org.photonvision:photontargeting-cpp:${photonVersion}:${wpi.platforms.desktop}@zip"

    implementation "com.stzteam.forgemini:ForgeMini:${toGradleRange(parsedJson.forgeMiniRequired)}"
    implementation "com.stzteam.mars:Mars:${toGradleRange(parsedJson.marsCoreRequired)}"

    // PhotonLib
    implementation "org.photonvision:photonlib-java:${photonVersion}"
    implementation "org.photonvision:photontargeting-java:${photonVersion}"

    // QuestNav. Used to publish the same protobuf messages the robot code consumes, sharing
    // the vendor adapters instead of reimplementing the serialization.
    implementation "gg.questnav:questnavlib-java:${questNavVersion}"
}

test {
    useJUnitPlatform()

    // On Windows the WPILib natives are built against the MSVC runtime that ships with the
    // WPILib JDK; on any other JDK the test JVM crashes while loading ntcore. Use the WPILib
    // JDK when it is installed and fall back to Gradle's own otherwise (Linux and macOS do not
    // need it, which is the CI case).
    //
    // Use `new File` rather than Gradle's `file()`: on Linux `file()` reads the leading "C:" of
    // the Windows path as a URL scheme and fails the whole configuration phase.
    def wpilibJdk = [
        "C:/Users/Public/wpilib/2026/jdk/bin/java.exe",
        "${System.getProperty('user.home')}/wpilib/2026/jdk/bin/java.exe"
    ].collect { new File(it.toString()) }.find { it.isFile() }

    if (wpilibJdk != null) {
        executable = wpilibJdk.absolutePath
    }
}

// Extracts the WPILib/PhotonVision natives onto the test classpath. Without this, any test
// that touches NetworkTables or 3D geometry kills the test JVM while loading the JNI.
wpi.java.configureTestTasks(test)

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = group
            artifactId = parsedJson.featureId 
            version = version
        }
    }
    
    repositories {
        maven {
            name = 'LocalRepo'
            url = layout.projectDirectory.dir('maven')
        }
    }
}

javadoc {
    options.addStringOption('Xdoclint:none', '-quiet')
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
}

task generateFeatureConstants {
    doLast {

        def packagePath = parsedJson.groupId.replace('.', '/')
        def srcDir = file("$projectDir/src/main/java/${packagePath}/generated")
        srcDir.mkdirs()
        
        def javaFile = new File(srcDir, "FeatureConstants.java")
        javaFile.text = """package ${parsedJson.groupId}.generated;

// AUTO-GENERATED FILE DO NOT EDIT
public final class FeatureConstants {
    public static final String FEATURE_VERSION = "${parsedJson.version}";
    public static final String FEATURE_NAME = "${parsedJson.featureId}";
}
"""
    }
}

compileJava.dependsOn generateFeatureConstants
