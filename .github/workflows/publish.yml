name: Publish MARS Feature

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Javadoc and Maven package
        run: ./gradlew clean publish javadoc -x test

      - name: Combine Javadoc and Maven
        run: |
          # Create the destination folder in case it does not exist
          mkdir -p build/docs/javadoc
          # Copy the 'maven' folder inside the Javadoc output
          cp -r maven build/docs/javadoc/maven
          # Copy the Feature JSON so the MARS CLI can find it
          cp MarsFeature.json build/docs/javadoc/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/docs/javadoc
